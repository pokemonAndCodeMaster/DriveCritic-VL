# ================= 全局配置 =================
output_dir: "./outputs/result_drivelm_v1"
device: "auto"

# ================= 模式选择 =================
# mode: "dataset" 或 "single"
mode: "dataset"

# ================= 数据配置 =================
# 1. 如果 mode=dataset，读取这里
dataset:
  name: "drivelm"  # 对应 all_datasets.yaml 里的 key
  config_path: "configs/all_datasets.yaml"

# 2. 如果 mode=single，读取这里
single_input:
  video_path: "/path/to/my_video.mp4"
  prompt: "Describe the driving scene details."

# ================= 模型配置 =================
model:
  path: "Qwen3-VL-2B-Instruct"
  max_new_tokens: 512
  load_bit: 16  # 16(bf16) or 4(bnb4)

# ================= 可视化配置 =================
visualization:
  enabled: true
  layers: [10, 20, 26]
  keywords: ["car", "traffic light", "pedestrian"]
  font_path: "assets/SimHei.ttf"
  save_dir: "viz_heatmaps"  # 相对 output_dir 的路径